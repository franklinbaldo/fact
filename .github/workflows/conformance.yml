name: Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minimal-okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate minimal compatibility fixture
        run: uvx --from okf-parser==0.41.3 okf-parser check examples/minimal
