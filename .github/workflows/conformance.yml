name: FACT Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  complete-dogfooding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require complete native FACT dogfooding
        run: python scripts/check_dogfooding.py .
      - name: Require language-neutral ignore conformance
        run: python scripts/check_ignore_conformance.py
