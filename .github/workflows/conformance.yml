name: Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minimal-okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate minimal compatibility fixture
        uses: franklinbaldo/okf-parser@v0.41.3
        with:
          path: examples/minimal
